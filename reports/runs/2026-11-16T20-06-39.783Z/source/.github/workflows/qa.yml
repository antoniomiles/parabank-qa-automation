name: ParaBank functional QA
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Resumen de resultados reales
        if: always()
        run: node scripts/summarize.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parabank-results-${{ github.run_id }}
          path: reports/latest/
          retention-days: 14
